<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js" defer></script>
    <title>calculator</title>
</head>
<body class=" flex flex-col items-center  min-h-screen p-4 overflow-hidden bg-slate-600">
<!-- <body class="bg-gray-50  bg-cover bg-no-repeat flex flex-col items-center justify-center min-h-screen p-4"> -->

    <p class="font-bold text-white text[25px] mb-[50px] font-sans">conduct your arithemetic calculation here</p>
 4ee1610176d000e24b699c0876b6e26111ed31eb -->

    <h1 class="text-yellow-500 font-bold text-3xl sm:text-4xl text-center mb-1">Jms calculus</h1>
    <p class="font-medium text-gray-300 text-sm sm:text-base text-center mb-4">conduct your arithmetics calculation here</p>

    <!-- Optimized container: Compact max-width and tighter padding for mobile -->
    <div class="w-full max-w-[380px] bg-black/60 p-4 sm:p-5 rounded-2xl shadow-2xl border border-gray-800 h-[600px]">
        
        <!-- Input display -->
        <input type="text" placeholder="0" id="input" class="w-full p-4 mb-4 text-right text-3xl bg-gray-800 text-white border border-gray-700 rounded-xl outline-none focus:border-yellow-500 transition-colors">
        
        <!-- Grid Layout: Consolidated into one unified layout with smaller gaps -->
        <div class="grid grid-cols-4 gap-2.5">
            <!-- Row 1 -->
            <button class="calculateNumber p-4 bg-gray-700 hover:bg-gray-600 text-white font-bold text-xl rounded-xl transition-all cursor-pointer">1</button>
            <button class="calculateNumber p-4 bg-gray-700 hover:bg-gray-600 text-white font-bold text-xl rounded-xl transition-all cursor-pointer">2</button>
            <button class="calculateNumber p-4 bg-gray-700 hover:bg-gray-600 text-white font-bold text-xl rounded-xl transition-all cursor-pointer">3</button>
            <button id="plusNumber" class="p-4 bg-amber-500 hover:bg-amber-400 text-white font-bold text-xl rounded-xl transition-all cursor-pointer">+</button>

            <!-- Row 2 -->
            <button class="calculateNumber p-4 bg-gray-700 hover:bg-gray-600 text-white font-bold text-xl rounded-xl transition-all cursor-pointer">4</button>
            <button class="calculateNumber p-4 bg-gray-700 hover:bg-gray-600 text-white font-bold text-xl rounded-xl transition-all cursor-pointer">5</button>
            <button class="calculateNumber p-4 bg-gray-700 hover:bg-gray-600 text-white font-bold text-xl rounded-xl transition-all cursor-pointer">6</button>
            <button id="minusNumber" class="p-4 bg-amber-500 hover:bg-amber-400 text-white font-bold text-xl rounded-xl transition-all cursor-pointer">-</button>

            <!-- Row 3 -->
            <button class="calculateNumber p-4 bg-gray-700 hover:bg-gray-600 text-white font-bold text-xl rounded-xl transition-all cursor-pointer">7</button>
            <button class="calculateNumber p-4 bg-gray-700 hover:bg-gray-600 text-white font-bold text-xl rounded-xl transition-all cursor-pointer">8</button>
            <button class="calculateNumber p-4 bg-gray-700 hover:bg-gray-600 text-white font-bold text-xl rounded-xl transition-all cursor-pointer">9</button>
            <button id="multiNumber" class="p-4 bg-amber-500 hover:bg-amber-400 text-white font-bold text-xl rounded-xl transition-all cursor-pointer">*</button>

            <!-- Row 4 -->
            <button id="decimal" class="p-4 bg-gray-700 hover:bg-gray-600 text-white font-bold text-xl rounded-xl transition-all cursor-pointer">.</button>
            <button class="calculateNumber p-4 bg-gray-700 hover:bg-gray-600 text-white font-bold text-xl rounded-xl transition-all cursor-pointer">0</button>
            <button id="percentage" class="p-4 bg-gray-600 hover:bg-gray-500 text-white font-bold text-lg rounded-xl transition-all cursor-pointer">%</button>
            <button id="divisionNumber" class="p-4 bg-amber-500 hover:bg-amber-400 text-white font-bold text-xl rounded-xl transition-all cursor-pointer">/</button>

            <!-- Row 5 -->
            <button id="removeAll" class="col-span-2 p-4 bg-red-500 hover:bg-red-400 text-white font-bold text-lg rounded-xl transition-all cursor-pointer">Clear</button>
            <button id="squareRoot" class="p-4 bg-gray-600 hover:bg-gray-500 text-white font-bold text-lg rounded-xl transition-all cursor-pointer">√</button>
            <button id="sumNumber" class="p-4 bg-emerald-500 hover:bg-emerald-400 text-white font-bold text-xl rounded-xl transition-all cursor-pointer">=</button>
        </div>
    </div>

</body>
</html>
